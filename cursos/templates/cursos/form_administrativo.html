{% extends 'base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}

    <h1>{{ titulo }}</h1>

    <form method="POST" class="auth-form">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button button-primary">
            Salvar
        </button>

        <a href="{% url voltar %}"
           class="button button-secondary">
            Cancelar
        </a>

    </form>

{% endblock %}
