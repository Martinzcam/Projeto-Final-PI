{% extends 'base.html' %}

{% block title %}Cadastro | Estude Mais{% endblock %}

{% block content %}

<div class="page-heading">

    <h2>Crie sua conta</h2>

    <p class="page-description">
        Cadastre-se para começar a acessar nossos cursos.
    </p>

</div>


<form method="POST" class="auth-form">

    {% csrf_token %}

    <label for="username">
        Nome de usuário
    </label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Escolha um nome de usuário"
        autocomplete="username"
    >


    <label for="email">
        E-mail
    </label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Digite seu e-mail"
        autocomplete="email"
    >


    <label for="password1">
        Senha
    </label>

    <input
        type="password"
        id="password1"
        name="password1"
        placeholder="Crie uma senha"
        autocomplete="new-password"
    >


    <label for="password2">
        Confirmar senha
    </label>

    <input
        type="password"
        id="password2"
        name="password2"
        placeholder="Digite novamente sua senha"
        autocomplete="new-password"
    >


    <button type="submit" class="button button-primary">
        Criar minha conta
    </button>

</form>


<p style="text-align: center;">

    Já possui uma conta?

    <a href="{% url 'login' %}">
        Faça login
    </a>

</p>

{% endblock %}
