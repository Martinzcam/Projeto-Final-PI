{% extends 'base.html' %}

{% block title %}Editar usuário{% endblock %}

{% block content %}

    <h1>Editar usuário</h1>

    <form method="POST" class="auth-form">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="button button-primary">
            Salvar
        </button>

        <a href="{% url 'gerenciar_usuarios' %}"
           class="button button-secondary">
            Cancelar
        </a>

    </form>

{% endblock %}
